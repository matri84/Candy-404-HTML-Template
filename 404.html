<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>۴۰۴ | صفحه پیدا نشد</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background">
        <div class="candy candy-1"></div>
        <div class="candy candy-2"></div>
        <div class="candy candy-3"></div>
        <div class="candy candy-4"></div>
        <div class="candy candy-5"></div>
        <div class="candy candy-6"></div>
        <div class="sparkle" id="sparkles"></div>
    </div>

    <main class="container">
        <div class="error-code">
            <span class="digit">۴</span>
            <span class="digit zero">۰</span>
            <span class="digit">۴</span>
        </div>

        <h1 class="title">اوه! گم شدیم...</h1>
        <p class="subtitle">صفحه مورد نظر پیدا نشد. شاید به دنیای آب‌نباتی رفته باشد!</p>

        <button class="home-btn" id="homeBtn" aria-label="بازگشت به صفحه اصلی">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/>
            </svg>
            <span>بازگشت به خانه</span>
        </button>
    </main>

    <script src="script.js"></script>
</body>
</html>
